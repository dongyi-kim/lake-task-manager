name: Code tests

on:
  # PR 생성뿐 아니라 PR branch에 새 commit이 push될 때(synchronize)마다 다시 검증한다.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: code-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: Python 3.11 / offline suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      TZ: Asia/Seoul
      JIRA_ENV: mock
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-agent.txt
            requirements-test.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt

      - name: Run deterministic tests
        run: |
          mkdir -p .cache/test-tmp .cache/test-results
          python -m pytest -q --basetemp=.cache/test-tmp/ci --durations=30 -ra --junitxml=.cache/test-results/pytest.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: code-tests-results
          path: .cache/test-results/pytest.xml
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
