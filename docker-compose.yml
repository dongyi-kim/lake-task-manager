# 실행:  docker compose up --build   →  http://localhost:8000
# LLM 키는 ① .env 파일(.env.example 참조) ② 셸 환경변수 ③ 실행 후 화면의 ⚙ 설정
# 셋 중 아무 방법이나 쓰면 된다. 키가 없어도 앱·HITL 흐름은 fake provider 로 확인 가능.
services:
  ltm-agent:
    build: .
    ports:
      - "8000:8000"
    environment:
      - JIRA_ENV=mock
      # Azure OpenAI (채점 환경 표준 변수 — 있으면 무설정으로 동작)
      - AOAI_ENDPOINT=${AOAI_ENDPOINT:-}
      - AOAI_API_KEY=${AOAI_API_KEY:-}
      - AOAI_DEPLOY_GPT4O_MINI=${AOAI_DEPLOY_GPT4O_MINI:-}
      - AOAI_DEPLOY_GPT4O=${AOAI_DEPLOY_GPT4O:-}
      - AOAI_DEPLOY_EMBED_3_SMALL=${AOAI_DEPLOY_EMBED_3_SMALL:-}
      - AOAI_API_VERSION=${AOAI_API_VERSION:-}
      # OpenAI 직접 사용 시(선택)
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - LAKE_AGENT_PROVIDER=${LAKE_AGENT_PROVIDER:-}
