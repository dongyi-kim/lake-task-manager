# === 개발(dev) 설정 ===
# 기본은 mock — Jira 없이 결정적 가상 데이터로 전체 앱 구동.  `python run.py`
# fake Jira 서버(:8080)로 실 HTTP 경로를 검증하려면 local 모드로 override:
#   터미널1:  python run_fake.py                 # :8080
#   터미널2:  JIRA_ENV=local python run.py        # local → fake 로 붙음
#   (PowerShell:  $env:JIRA_ENV="local"; python run.py)
#
# ※ 환경변수(JIRA_ENV 등)가 아래 값보다 우선한다(override).

env: mock                                  # mock | local | prod

jira:
  # ★ localhost 가 아니라 127.0.0.1 — Windows 에서 localhost 는 ::1(IPv6) 로 먼저 해석되는데
  #   fake 서버는 IPv4 에만 바인딩돼 연결마다 IPv6 실패 후 폴백에 ~2초가 걸린다(검색이 통째로 느려짐).
  base: http://127.0.0.1:8080              # fake Jira 서버
  project_key: DL
  # fake 는 아무 basic auth 나 수용. PAT 를 쓰면 token 에 토큰 넣고 auth: bearer.
  auth: basic                              # basic | bearer
  user: admin
  token: admin
  state_path: jira_state.json
  # fake /rest/api/2/field 가 주는 값과 일치
  fields:
    story_point: customfield_10004
    epic_link:   customfield_10008
    epic_name:   customfield_10011   # Epic 단축어(보드 칸 이름) — 요약과 별개 필드

confluence:
  base: http://127.0.0.1:8080              # fake 가 Confluence CQL 도 같은 호스트로 서빙(위와 같은 이유로 127.0.0.1)
  # 타깃 사내 Confluence DC 버전 = 9.2.4 (통합 검색 CQL·9.x URL 스펙 기준). dev mock 도 동일 버전 구성.

# 통합 검색(우상단) 기본 스코프. 모두 복수(list). 화면 상단 확장 옵션에서 전체로 넓힐 수 있다.
#   dev: mock world 에 DL/PMO/ARCH/OPS 스페이스 + JIRA820 프로젝트(jira820 자체 샘플)가 함께 있어
#        멀티 프로젝트/스페이스를 그대로 검증 가능.
search:
  jira:       { projects: [DL, JIRA820] }
  confluence: { spaces: [DL, PMO] }
  bitbucket:  { projects: [DATA] }         # mock (사내 Bitbucket 버전 확인 전까지 가짜 결과)

# 매니저(PM/PL) Jira 사용자 ID 목록 — **화이트리스트**.
#   여기 있는 사람에게만  WBS Dashboard · 인력 워크로드  가 보인다.
#   현안(PMO_VIT)·내 Task·티켓 뷰/다이얼로그는 누구나 쓴다(역할 무관).
#   ※ 비워 두면 제한 없음(모두 매니저) — 빈 목록은 '아무도 없음' 이 아니라 '미설정' 이다.
#   dev 는 mock 세션 사용자(test.ui01)를 매니저로 둬 전 화면을 그대로 검증한다.
manager: [test.ui01]

cache:
  db_path: cache-dev.sqlite3
  ttl_seconds: 900
  # dead_ttl — 이 시각이 지나야 '없는 값'. 그 전까지는 **오프라인·SSO 만료 상태에서도**
  # 낡은 값을 그대로 화면에 준다(상단 알림이 낡았음을 알린다). ttl_seconds 는 '낡음' 기준일 뿐이다.
  dead_ttl_seconds: 86400                  # 24시간

server:
  host: 127.0.0.1
  port: 4457
