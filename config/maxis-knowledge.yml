contract: ltm-knowledge-source.v2

# Source of truth for the governed static documents mirrored into each environment's
# immutable MAXIS/Dify Knowledge release. Runtime profiles bind this source release to
# one environment-specific dataset UUID and release sentinel.
role_registry: config/maxis-workflows.yml

governance:
  review_cycle_days: 90
  immutable_release: true
  deployment_strategy: blue_green
  # Raw-file SHA-256 of deploy/maxis-dify/knowledge-evals.yml. The bundle validator
  # rejects drift; runtime attestation still does not inspect the external result file.
  eval_suite_sha256: 3372861852b8901b0a8deb2306009d982240e8ce8fdddb3328a48f5ef167a805

chunking:
  strategy: markdown-headings-then-length.v1
  max_chars: 1200
  overlap_chars: 120

