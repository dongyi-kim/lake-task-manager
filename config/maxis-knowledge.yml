contract: ltm-knowledge-source.v2

# Source of truth for the governed static documents mirrored into each environment's
# immutable MAXIS/Dify Knowledge release. Runtime profiles bind this source release to
# one environment-specific dataset UUID and release sentinel.
role_registry: config/maxis-workflows.yml

governance:
  review_cycle_days: 90
  immutable_release: true
  deployment_strategy: blue_green
  # Raw-file SHA-256 of deploy/maxis-dify/knowledge-evals.yml. The bundle validator
  # rejects drift; runtime attestation still does not inspect the external result file.
  eval_suite_sha256: 02c6309e618cc6a706d6887ac14491ba397e49bab48399f769e61a8d8e597fec

chunking:
  strategy: markdown-headings-then-length.v1
  max_chars: 1200
  overlap_chars: 120

documents:
  - id: ticket-rules
    path: knowledge/01-ticket-rules.md
    revision: 1
    reviewed_for_release: true
    reviewed_for_version: ltm-knowledge-2026.09
    reviewed_at: "2026-09-04T15:00:00Z"
    # SHA-256("ltm-repository-review-checkpoint:2026-09-05"): a non-personal
    # repository checkpoint for correlation, not a claim about a named human approver.
    reviewer_digest: 7d558f837e1439283f08f8cab987fddb3442115d1a3fa83338094d6585518862
    owner: pmo-governance
    classification: internal
    audience: all_ltm_users
    allowed_roles:
      - request_architect
