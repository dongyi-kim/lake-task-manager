# Lake Task Manager - 모듈(=Jira Component)의 **다른 이름**  ★ [DEV/FAKE] src/config = 개발용
#
# 왜 이 파일이 따로 있나
#   resolve_module() 은 표기(대소문자·공백·하이픈)만 맞추고 **뜻으로는 추측하지 않는다.**
#   모듈은 워크로드 집계의 축이라, 코드가 "쿼리 엔진"을 Runtime 으로 넘겨짚으면 남의
#   모듈에 조용히 계상된다 — 틀려도 아무 데서도 안 터진다. 그래서 뜻의 매핑은 코드가
#   아니라 **사람이 여기 적어 두고**, 코드는 여기 적힌 것만 본다.
#   여기 없는 말은 **못 찾은 것으로 둔다**(""). 그게 맞는 실패다.
#
# 출처는 `knowledge/03-modules-and-people.md` 의 모듈 표(하는 일 / 이런 요청이 오면)다.
# 표를 고치면 여기도 같이 고친다. 키가 people.yaml 의 모듈과 어긋나면 테스트가 잡는다.
#
# 적는 요령 — **좁게 적는다.** 이 표는 "요청이 두 모듈에 걸치는가"를 코드가 판정하는 데
# 쓰이고, 그 판정은 티켓을 **나눌지 말지**를 바꾼다. "운영"·"엔진"·"배포" 같은 흔한 낱말을
# 넣으면 아무 요청이나 두 모듈에 걸친 것이 된다. 그 모듈을 가리키는 말만 적는다.
# 공백·하이픈·대소문자는 코드가 지우고 비교하므로 한 가지 표기만 적으면 된다.

