# Lake Task Manager — WBS 구성 (기능1)  ★ [DEV/FAKE] src/config = 개발용
# fake 서버가 이 DL-xxxx epic 들을 생성한다. prod 실데이터는 repo 루트 config/ 에 있다.
#
# 구조: wbs → (module 별) → tasks → 각 task(name, 기간) → 소속 epic(ticket + weight)
#   - ticket = 실제 Jira Epic 티켓 키 (DL-xxxx). Epic 이름/상태/자식은 Jira 에 있음(여기 안 적음).
#   - 같은 Epic 을 여러 task 가 다른 weight 로 참조 = N:M 공유.
#   - weight = 상대 가중치(정수 권장). 합이 1이 아니어도 자동 정규화됨. 예) 6/4 == 60%/40%, 3/1 == 75%/25%.
#   - start/end 는 간트차트용 (일정은 PMO 계획 산출물이라 여기서 관리).

