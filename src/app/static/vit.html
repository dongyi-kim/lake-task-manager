<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lake Task Manager — 현안(PMO_VIT)</title>
<style>
  :root {
    --bg:#f9f9f7; --panel:#fcfcfb; --panel-2:#f2f1ee; --border:#e1e0d9; --text:#0b0b0b;
    --muted:#52514e; --accent:#2a78d6; --done:#0ca30c; --prog:#2a78d6; --todo:#898781;
    --track:#e5e4de; --today:#d03b3b; --shadow:0 1px 3px rgba(11,11,11,.08);
    --c1:#2a78d6; --c2:#1baf7a; --c3:#eda100; --c4:#008300; --c5:#4a3aa7; --c6:#e34948; --c7:#e87ba4;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0d0d0d; --panel:#1a1a19; --panel-2:#232322; --border:#2c2c2a; --text:#fff;
      --muted:#c3c2b7; --accent:#3987e5; --done:#0ca30c; --prog:#3987e5; --todo:#898781;
      --track:#2c2c2a; --today:#e66767; --shadow:0 1px 3px rgba(0,0,0,.4);
      --c1:#3987e5; --c2:#199e70; --c3:#c98500; --c4:#2f9e2f; --c5:#9085e9; --c6:#e66767; --c7:#d55181; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font-family:"Segoe UI","Malgun Gothic",system-ui,sans-serif; font-size:14px; line-height:1.5; }
  .wrap { max-width:none; margin:0; padding:22px 28px 60px; }
  h1 { font-size:20px; margin:0; } h1 .sub { color:var(--muted); font-weight:500; font-size:13px; margin-left:8px; }
  .meta { color:var(--muted); font-size:12px; float:right; margin-top:6px; }
  nav { display:flex; gap:4px; margin:12px 0 16px; }
  nav a { font-size:13px; color:var(--muted); text-decoration:none; padding:5px 12px; border-radius:8px; border:1px solid transparent; }
  nav a.on { color:var(--text); border-color:var(--border); background:var(--panel); font-weight:600; }
  .lnk { color:var(--accent); text-decoration:none; } .lnk:hover { text-decoration:underline; }
  .muted { color:var(--muted); }

  .summary { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:6px; }
  .schip { background:var(--panel); border:1px solid var(--border); border-radius:999px; padding:5px 12px; font-size:12.5px; box-shadow:var(--shadow); }
  .schip b { font-variant-numeric:tabular-nums; }
  .schip .dot { width:9px; height:9px; border-radius:3px; display:inline-block; margin-right:6px; vertical-align:middle; }
  .schip.total { background:var(--accent); color:#fff; border-color:transparent; }
  .dedup { color:var(--muted); font-size:12px; margin:0 0 14px; }

  .mod-h { display:flex; align-items:center; gap:8px; margin:20px 0 6px; }
  .mod-h .dot { width:12px; height:12px; border-radius:3px; display:inline-block; }
  .mod-h b { font-size:15px; } .mod-h .c { color:var(--muted); font-size:12px; }
  .empty { color:var(--muted); font-size:12.5px; padding:2px 0 6px; }

  /* 테이블(그리드) */
  .tbl { background:var(--panel); border:1px solid var(--border); border-radius:12px; box-shadow:var(--shadow); overflow:hidden; }
  .vhead, .vrow { display:grid; grid-template-columns:minmax(260px,2.4fr) 120px minmax(150px,1.3fr) minmax(210px,2fr) minmax(230px,2.2fr) 64px; gap:14px; }
  .vhead { padding:8px 16px; font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.4px; background:var(--panel-2); border-bottom:1px solid var(--border); }
  .vrow { padding:11px 16px; border-top:1px solid var(--border); align-items:start; }
  .vrow:first-child { border-top:none; }
  .vrow:hover { background:rgba(127,127,127,.035); }

  .c-info .l1 { display:flex; align-items:center; gap:7px; margin-bottom:3px; }
  .badge { font-size:9.5px; font-weight:700; border-radius:4px; padding:1px 5px; border:1px solid var(--border); color:var(--muted); flex:0 0 auto; }
  .badge.epic { color:var(--accent); border-color:var(--accent); }
  .key { font-size:11px; color:var(--muted); font-variant-numeric:tabular-nums; }
  .pill { font-size:10.5px; font-weight:600; border-radius:999px; padding:1px 8px; color:#fff; }
  .pill.done { background:var(--done); } .pill.inprogress { background:var(--prog); } .pill.todo { background:var(--todo); }
  .c-info .summ { font-weight:600; font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .c-info .who { color:var(--muted); font-size:11.5px; margin-top:2px; } .c-info .who::before { content:"\1F464  "; }

  .c-date { font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; }
  .c-date .nodue { color:var(--today); font-weight:700; }

  .c-prog .bar { height:8px; background:var(--track); border-radius:999px; overflow:hidden; }
  .c-prog .bar>i { display:block; height:100%; border-radius:999px; }
  .c-prog .n { font-size:11.5px; color:var(--muted); margin-top:3px; font-variant-numeric:tabular-nums; }
  .c-prog .n b { color:var(--text); }

  .mini { font-size:11.5px; padding:1px 0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .mini .tdot { width:7px; height:7px; border-radius:50%; display:inline-block; margin-right:5px; vertical-align:middle; }
  .tdot.done { background:var(--done); } .tdot.inprogress { background:var(--prog); } .tdot.todo { background:var(--todo); }
  .mini .tb { font-size:9px; color:var(--muted); border:1px solid var(--border); border-radius:3px; padding:0 3px; margin-right:4px; }
  .mini .d { color:var(--muted); font-variant-numeric:tabular-nums; margin-right:6px; }
  .mini .act { font-weight:700; margin-right:5px; }
  .mini .act.created { color:var(--accent); } .mini .act.done, .mini .act.resolved { color:var(--done); }
  .mini .sm { color:var(--muted); }
  /* 하위 티켓 상태 — 현안 pill 과 같은 방식(색 있는 텍스트) */
  .spill { font-size:9.5px; font-weight:700; border-radius:999px; padding:0 7px; color:#fff; margin-right:5px; flex:0 0 auto; }
  .spill.done { background:var(--done); } .spill.inprogress { background:var(--prog); } .spill.todo { background:var(--todo); }
  .more { color:var(--accent); font-size:11px; cursor:pointer; background:none; border:none; padding:2px 0; }
  .more:hover { text-decoration:underline; }

  .c-x { text-align:right; }
  .xbtn { background:var(--panel-2); border:1px solid var(--border); color:var(--muted); border-radius:7px; font-size:11px; padding:3px 7px; cursor:pointer; white-space:nowrap; }
  .xbtn:hover { color:var(--text); }

  .detail { grid-column:1 / -1; display:none; margin-top:8px; border-top:1px dashed var(--border); padding-top:9px; }
  .detail.open { display:block; }
  .dcols { display:grid; grid-template-columns:1.3fr 1fr; gap:24px; }
  @media (max-width:1000px){ .dcols { grid-template-columns:1fr; } }
  .sec-t { font-size:11px; color:var(--muted); margin:0 0 5px; }
  .tnode { display:flex; align-items:center; gap:7px; font-size:12px; padding:2px 0; }
  .tnode .tsum { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .tnode .tprog { margin-left:auto; color:var(--muted); font-size:11px; flex:0 0 auto; }
  .cmt { font-size:12px; padding:3px 0; border-top:1px solid var(--border); }
  .cmt .h { color:var(--muted); font-size:11px; } .cmt .h b { color:var(--text); }
  #err { color:var(--today); padding:20px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="meta" id="meta"></div>
  <h1>Lake Task Manager <span class="sub">현안 트래킹 (PMO_VIT)</span></h1>
  <nav>
    <a href="/">WBS Dashboard</a>
    <a href="/vit.html" class="on">현안 (PMO_VIT)</a>
    <a href="/workload.html">인력 워크로드</a>
  </nav>
  <div class="summary" id="summary"></div>
  <div class="dedup" id="dedup"></div>
  <div id="mods"></div>
</div>

<script>
var MODCOL = {}, JB = "";
var ROWCAP = 4;   // 하위티켓/소식 행에 보이는 최대 개수 (나머지는 [자세히])
var KLAB = {created:"생성됨", done:"완료됨", resolved:"해결됨"};   // 활동 설명
function el(t,c,h){ var e=document.createElement(t); if(c)e.className=c; if(h!=null)e.innerHTML=h; return e; }
function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function mdISO(s){ if(!s) return ""; var p=s.split("-"); return (+p[1])+"/"+(+p[2]); }
function pctOf(p){ return (Math.round((p||0)*10)/10)+"%"; }
function tkt(key){ if(!key) return ""; return JB ? "<a class='lnk' target='_blank' rel='noopener' href='"+JB+"/browse/"+key+"'>"+key+"</a>" : key; }
function flatten(ns,out){ out=out||[]; (ns||[]).forEach(function(n){ out.push(n); flatten(n.children,out); }); return out; }
function newsLine(ev){
  // 활동 설명: [날짜] [무엇을 했는지] [대상 티켓 타입·키·제목]
  var typ = ev.type ? "<span class='tb'>"+ev.type+"</span>" : "";
  return el("div","mini "+ev.kind,
    "<span class='d'>"+mdISO(ev.date)+"</span><span class='act "+ev.kind+"'>"+(KLAB[ev.kind]||ev.kind)+"</span>"
    +typ+tkt(ev.key)+" <span class='sm'>"+esc(ev.title||"")+"</span>");
}

function render(D){
  JB = D.jiraBase || "";
  document.getElementById("meta").textContent = "project "+D.projectKey+" · 갱신 "+D.generatedAt;
  D.modules.forEach(function(m,i){ MODCOL[m.module]="var(--c"+(i%7+1)+")"; });

  var sum=document.getElementById("summary"); sum.innerHTML="";
  sum.appendChild(el("div","schip total","<b>"+D.summary.total+"</b> 현안 (PMO_VIT)"));
  D.modules.forEach(function(m){
    sum.appendChild(el("div","schip","<span class='dot' style='background:"+MODCOL[m.module]+"'></span>"+m.module+" <b>"+m.issues.length+"</b>"));
  });
  document.getElementById("dedup").textContent = D.summary.skippedDup
    ? ("상위가 이미 PMO_VIT 인 자손 현안 "+D.summary.skippedDup+"건은 중복으로 숨김") : "";

  var box=document.getElementById("mods"); box.innerHTML="";
  D.modules.forEach(function(m){
    box.appendChild(el("div","mod-h","<span class='dot' style='background:"+MODCOL[m.module]+"'></span><b>"+m.module+"</b><span class='c'>"+m.issues.length+" 현안</span>"));
    if(!m.issues.length){ box.appendChild(el("div","empty","· 현안 없음")); return; }
    var tbl=el("div","tbl");
    tbl.appendChild(el("div","vhead",
      "<div>티켓</div><div>시작 ~ 마감</div><div>진척(자손)</div><div>하위 티켓</div><div>최근 하위 소식</div><div></div>"));
    m.issues.forEach(function(it){ tbl.appendChild(row(it)); });
    box.appendChild(tbl);
  });
}

function row(it){
  var r=el("div","vrow"), col=MODCOL[it.module]||"var(--accent)";
  var flat=flatten(it.tree);

  // 1) 티켓 정보
  var info=el("div","c-info");
  info.appendChild(el("div","l1",
    "<span class='badge"+(it.type==="Epic"?" epic":"")+"'>"+it.type+"</span>"
    +"<span class='key'>"+tkt(it.key)+"</span><span class='pill "+it.statusCategory+"'>"+it.status+"</span>"));
  info.appendChild(el("div","summ", esc(it.summary)));
  info.appendChild(el("div","who", esc(it.assignee||"미지정")));
  r.appendChild(info);

  // 2) 시작 ~ 마감
  var due = it.due ? mdISO(it.due) : "<span class='nodue'>마감 미정</span>";
  r.appendChild(el("div","c-date","시작 "+(mdISO(it.start)||"?")+"<br>마감 "+due));

  // 3) 진척 (자손 개수 기반)
  var p=it.progress||{done:0,total:0,pct:0};
  var pc=el("div","c-prog");
  var bar=el("div","bar"); var f=el("i"); f.style.width=p.pct+"%"; f.style.background=col; bar.appendChild(f); pc.appendChild(bar);
  pc.appendChild(el("div","n","<b>"+p.done+"/"+p.total+"</b> ("+pctOf(p.pct)+")"));
  r.appendChild(pc);

  // 4) 하위 티켓 (상태점 · 타입 · 키 · 제목)
  var subs=el("div","c-subs");
  flat.slice(0,ROWCAP).forEach(function(n){
    subs.appendChild(el("div","mini",
      "<span class='spill "+n.statusCategory+"'>"+esc(n.status||n.statusCategory)+"</span><span class='tb'>"+n.type+"</span>"
      +tkt(n.key)+" <span class='sm'>"+esc(n.summary||"")+"</span>"));
  });
  if(flat.length>ROWCAP) subs.appendChild(el("div","mini muted","+ "+(flat.length-ROWCAP)+" 더 …"));
  if(!flat.length) subs.appendChild(el("div","mini muted","-"));
  r.appendChild(subs);

  // 5) 최근 하위 소식 (활동 설명: 날짜 · 무엇을 했는지 · 대상 티켓)
  var news=el("div","c-news");
  (it.news||[]).slice(0,ROWCAP).forEach(function(ev){ news.appendChild(newsLine(ev)); });
  if((it.news||[]).length>ROWCAP) news.appendChild(el("div","mini muted","+ "+(it.news.length-ROWCAP)+" 더 …"));
  if(!(it.news||[]).length) news.appendChild(el("div","mini muted","-"));
  r.appendChild(news);

  // 6) [자세히]
  var det=el("div","detail");
  var xc=el("div","c-x"); var btn=el("button","xbtn","자세히 ▾"); xc.appendChild(btn); r.appendChild(xc);
  det.appendChild(detail(it, flat));
  r.appendChild(det);
  btn.addEventListener("click",function(){ det.classList.toggle("open");
    btn.textContent = det.classList.contains("open") ? "접기 ▴" : "자세히 ▾"; });
  return r;
}

function detail(it, flat){
  var wrap=el("div","dcols");
  // 왼쪽: 소속 티켓 트리
  var left=el("div",null,"<div class='sec-t'>소속 티켓 트리 ("+flat.length+"개 · 상태·최근 진척)</div>");
  left.appendChild(treeRows(it.tree||[],0));
  // 오른쪽: 코멘트 + 전체 소식
  var right=el("div",null,"<div class='sec-t'>코멘트 (현안 티켓 기준)</div>");
  if(it.comments && it.comments.length){
    it.comments.forEach(function(x){ right.appendChild(el("div","cmt","<div class='h'><b>"+esc(x.author||"?")+"</b> · "+mdISO(x.date)+"</div>"+esc(x.text))); });
  } else { right.appendChild(el("div","mini muted","코멘트 없음")); }
  if((it.news||[]).length>ROWCAP){
    right.appendChild(el("div","sec-t","전체 최근 소식"));
    it.news.forEach(function(ev){ right.appendChild(newsLine(ev)); });
  }
  wrap.appendChild(left); wrap.appendChild(right);
  return wrap;
}

function treeRows(nodes, depth){
  var frag=document.createDocumentFragment();
  nodes.forEach(function(n){
    var row=el("div","tnode"); row.style.paddingLeft=(depth*16)+"px";
    var prog = n.resolved ? ("완료 "+mdISO(n.resolved)) : (n.created ? ("생성 "+mdISO(n.created)) : "");
    row.innerHTML="<span class='spill "+n.statusCategory+"'>"+esc(n.status||n.statusCategory)+"</span><span class='tb'>"+n.type+"</span>"
      +"<span class='key'>"+tkt(n.key)+"</span><span class='tsum'>"+esc(n.summary||"")+"</span>"
      +"<span class='tprog'>"+prog+"</span>";
    frag.appendChild(row);
    if(n.children && n.children.length) frag.appendChild(treeRows(n.children, depth+1));
  });
  return frag;
}

fetch("/api/vit").then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
  .then(render)
  .catch(function(e){ document.querySelector(".wrap").insertAdjacentHTML("beforeend",
    "<div id='err'>현안 데이터를 불러오지 못했습니다: "+e.message+"</div>"); });
</script>
</body>
</html>
