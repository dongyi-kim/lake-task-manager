<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lake Task Manager</title>
<!-- /browse/{key} 같은 하위 경로에서도 상대 자산(styles/…, app.js)이 루트 기준으로 풀리게 -->
<base href="/">
<link rel="icon" href="favicon.ico" sizes="16x16 24x24 32x32 48x48 64x64">
<link rel="icon" type="image/png" sizes="256x256" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<script>
  // 테마 초기화 (paint 전 실행 → 깜빡임 방지). 저장값 우선, 없으면 시스템값을 '고정'.
  (function () {
    try {
      var t = localStorage.getItem("theme") ||
        (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", t);
    } catch (e) {}
  })();
</script>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="styles/tokens.css">
<link rel="stylesheet" href="styles/base.css">
<link rel="stylesheet" href="styles/components.css">
    <link rel="stylesheet" href="styles/filebadge.css">
<link rel="stylesheet" href="styles/workload.css">
<link rel="stylesheet" href="styles/vit.css">
<link rel="stylesheet" href="styles/wbs.css">
<link rel="stylesheet" href="styles/ticket.css">
<link rel="stylesheet" href="styles/search.css">
<link rel="stylesheet" href="styles/mytasks.css">
<style>
  /* 앱 부팅 로더 — Vue 가 #app 을 렌더하면 교체되어 사라짐(첫 구동 흰 화면 방지) */
  .app-boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 16px; background: var(--bg, #f9f9f7); z-index: 9999; }
  .app-boot-icon { width: 88px; height: 88px; border-radius: 20px; box-shadow: 0 8px 24px rgba(0,0,0,.16); }
  .app-boot-spin { width: 34px; height: 34px; border-radius: 50%; margin-top: 4px;
    border: 3px solid var(--border, #e1e0d9); border-top-color: var(--accent, #6d4fc0);
    animation: app-boot-spin .8s linear infinite; }
  .app-boot-txt { font: 600 16px/1.2 "Pretendard Variable", Pretendard, system-ui, sans-serif;
    color: var(--text, #0b0b0b); letter-spacing: -.2px; }
  .app-boot-sub { font-size: 12.5px; color: var(--muted, #6b778c); }
  @keyframes app-boot-spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="app">
  <div class="app-boot">
    <img class="app-boot-icon" src="icon.png" alt="">
    <div class="app-boot-spin"></div>
    <div class="app-boot-txt">Lake Task Manager</div>
    <div class="app-boot-sub">불러오는 중…</div>
  </div>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
