<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="820" viewBox="0 0 1800 820" role="img" aria-labelledby="title desc">
  <title id="title">Dify Native 11노드 11엣지 워크플로</title>
  <desc id="desc">Start에서 Sentinel Query와 Role ACL Key로 분기한다. Release Sentinel과 Role Knowledge가 Knowledge Guard에서 합쳐지고 Policy Decision이 allow를 Contract LLM, Contract Guard, Allowed Answer로 보내며 deny 또는 no-hit을 Denied Answer로 보낸다. 전체 11노드 11엣지다.</desc>
  <defs>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#102a43"/>
      <stop offset="1" stop-color="#1f6feb"/>
    </linearGradient>
    <filter id="shadow" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#102a43" flood-opacity=".14"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0 0L10 5 0 10Z" fill="#3979ba"/>
    </marker>
    <style>
      text{font-family:'Noto Sans KR','Malgun Gothic',Arial,sans-serif;fill:#243b53}
      .title{font-size:17px;font-weight:800}
      .sub{font-size:12px;fill:#627d98}
      .num{font-size:12px;font-weight:800;fill:#1f6feb}
      .edge{fill:none;stroke:#3979ba;stroke-width:3;marker-end:url(#arrow)}
      .edge-label{font-size:12px;font-weight:800;fill:#285f96}
      .lane{font-size:13px;font-weight:800;letter-spacing:1px}
      .hero-kicker{font-size:14px;font-weight:700;letter-spacing:2px;fill:#cde2ff}
      .hero-title{font-size:32px;font-weight:800;fill:#fff}
      .hero-meta{font-size:15px;fill:#d9ecff}
    </style>
  </defs>

  <rect width="1800" height="820" fill="#f4f7fb"/>
  <rect width="1800" height="120" fill="url(#hero)"/>
  <text class="hero-kicker" x="58" y="49">DIFY ADVANCED CHATFLOW · NATIVE ACL V5 · 2026.09</text>
  <text class="hero-title" x="58" y="88">최종 게시 topology · 11 nodes / 11 edges</text>
  <text class="hero-meta" x="1742" y="84" text-anchor="end">Agent Core · Editor Author · PMO Brief</text>

  <rect x="205" y="145" width="450" height="170" rx="18" fill="#fff8e6" stroke="#edd590"/>
  <text class="lane" x="225" y="171" fill="#8a6100">RELEASE BINDING</text>
  <rect x="205" y="450" width="450" height="170" rx="18" fill="#edf9f1" stroke="#b9e3c9"/>
  <text class="lane" x="225" y="476" fill="#16794b">POLICY RAG · ROLE METADATA ACL</text>
  <rect x="690" y="285" width="465" height="220" rx="18" fill="#eaf3ff" stroke="#b9d5f1"/>
  <text class="lane" x="712" y="313" fill="#1f6feb">DETERMINISTIC PRE-LLM GATE</text>
  <rect x="1165" y="145" width="575" height="170" rx="18" fill="#f4edff" stroke="#d4c5ef"/>
  <text class="lane" x="1185" y="171" fill="#7656b0">ALLOW PATH · STRUCTURED GENERATION</text>
  <rect x="1165" y="485" width="270" height="150" rx="18" fill="#fff0f1" stroke="#efbec4"/>
  <text class="lane" x="1185" y="511" fill="#a33a48">DENY / NO-HIT PATH</text>

  <!-- 11 explicit edges -->
  <path class="edge" d="M180 360 C204 360 204 230 230 230"/>
  <path class="edge" d="M400 230 H450"/>
  <path class="edge" d="M180 400 C204 400 204 535 230 535"/>
  <path class="edge" d="M400 535 H450"/>
  <path class="edge" d="M630 230 C682 230 680 355 720 355"/>
  <path class="edge" d="M630 535 C682 535 680 415 720 415"/>
  <path class="edge" d="M910 385 H975"/>
  <path class="edge" d="M1055 320 C1080 250 1120 230 1190 230"/>
  <path class="edge" d="M1370 230 H1410"/>
  <path class="edge" d="M1590 230 H1630"/>
  <path class="edge" d="M1055 450 C1080 535 1120 560 1190 560"/>

  <!-- Nodes -->
  <g filter="url(#shadow)">
    <rect x="40" y="330" width="140" height="100" rx="16" fill="#fff" stroke="#9ec5ee" stroke-width="2"/>
    <text class="num" x="56" y="354">01</text>
    <text class="title" x="110" y="383" text-anchor="middle">Start</text>
    <text class="sub" x="110" y="407" text-anchor="middle">6 required inputs</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="230" y="185" width="170" height="90" rx="15" fill="#fffdf5" stroke="#dfbd60" stroke-width="2"/>
    <text class="num" x="246" y="207">02</text>
    <text class="title" x="315" y="234" text-anchor="middle">Sentinel Query</text>
    <text class="sub" x="315" y="257" text-anchor="middle">fixed · input separated</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="450" y="185" width="180" height="90" rx="15" fill="#fff7df" stroke="#dfbd60" stroke-width="2"/>
    <text class="num" x="466" y="207">03</text>
    <text class="title" x="540" y="234" text-anchor="middle">Release Sentinel</text>
    <text class="sub" x="540" y="257" text-anchor="middle">V3 · Top 1 · 1 segment</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="230" y="490" width="170" height="90" rx="15" fill="#f7fcf8" stroke="#86cba2" stroke-width="2"/>
    <text class="num" x="246" y="512">04</text>
    <text class="title" x="315" y="539" text-anchor="middle">Role ACL Key</text>
    <text class="sub" x="315" y="562" text-anchor="middle">delimited exact key</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="450" y="490" width="180" height="90" rx="15" fill="#effaf3" stroke="#86cba2" stroke-width="2"/>
    <text class="num" x="466" y="512">05</text>
    <text class="title" x="540" y="539" text-anchor="middle">Role Knowledge</text>
    <text class="sub" x="540" y="562" text-anchor="middle">metadata filter · Top 2</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="720" y="335" width="190" height="100" rx="16" fill="#e8f8f5" stroke="#4fb39d" stroke-width="2.5"/>
    <text class="num" x="738" y="360">06</text>
    <text class="title" x="815" y="388" text-anchor="middle">Knowledge Guard</text>
    <text class="sub" x="815" y="412" text-anchor="middle">identity · ACL · bounds</text>
  </g>

  <g filter="url(#shadow)">
    <polygon points="1055,320 1135,385 1055,450 975,385" fill="#dceeff" stroke="#4b91d1" stroke-width="2.5"/>
    <text class="num" x="1036" y="361">07</text>
    <text class="title" x="1055" y="388" text-anchor="middle">Policy</text>
    <text class="title" x="1055" y="408" text-anchor="middle">Decision</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1190" y="185" width="180" height="90" rx="15" fill="#f7f2ff" stroke="#af91dd" stroke-width="2"/>
    <text class="num" x="1206" y="207">08</text>
    <text class="title" x="1280" y="234" text-anchor="middle">Contract LLM</text>
    <text class="sub" x="1280" y="257" text-anchor="middle">structured output</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1410" y="185" width="180" height="90" rx="15" fill="#fff5f6" stroke="#dd929c" stroke-width="2"/>
    <text class="num" x="1426" y="207">09</text>
    <text class="title" x="1500" y="234" text-anchor="middle">Contract Guard</text>
    <text class="sub" x="1500" y="257" text-anchor="middle">schema · source · UUID</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1630" y="185" width="130" height="90" rx="15" fill="#e8f7ee" stroke="#69bb8b" stroke-width="2"/>
    <text class="num" x="1646" y="207">10</text>
    <text class="title" x="1695" y="234" text-anchor="middle">Allowed</text>
    <text class="sub" x="1695" y="257" text-anchor="middle">Answer</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1190" y="520" width="220" height="90" rx="15" fill="#ffecee" stroke="#df808d" stroke-width="2"/>
    <text class="num" x="1206" y="542">11</text>
    <text class="title" x="1300" y="569" text-anchor="middle">Denied Answer</text>
    <text class="sub" x="1300" y="592" text-anchor="middle">deterministic · no LLM</text>
  </g>

  <text class="edge-label" x="1105" y="284">allow</text>
  <text class="edge-label" x="1090" y="521">deny / no-hit</text>

  <rect x="58" y="675" width="1684" height="92" rx="14" fill="#fff" stroke="#d9e2ec"/>
  <text x="85" y="708" font-size="14" font-weight="800" fill="#102a43">신뢰 경계</text>
  <text x="85" y="734" font-size="13" fill="#526d82">Policy RAG는 규칙·형식·허용 행동만 제한한다. 업무 사실의 claim과 citation은 LTM이 만든 citation-grade EvidencePack에만 결속된다.</text>
  <text x="85" y="757" font-size="13" fill="#526d82">ACL deny/no-hit은 LLM을 우회하며, allow 결과도 Dify Contract Guard와 LTM ResponseGuard를 모두 통과해야 한다.</text>
</svg>
