          \        _fail()\n    _ = parsed.port\n    return url, _text(source[\"title\"\
          ])\n\n\ndef _issue_key(value):\n    return value if isinstance(value, str)\
          \ and _ISSUE_KEY.fullmatch(value) else \"\"\n\n\ndef _owner(value, path,\
          \ inherited):\n    if any(part in _JIRA_METADATA for part in path.split(\"\
          /\")):\n        return inherited  # User/status keys may look exactly like\
          \ issue keys.\n    key = _issue_key(value.get(\"key\"))\n    if key:\n \
          \       return key\n    # Raw Jira status/category keys are metadata, not\
