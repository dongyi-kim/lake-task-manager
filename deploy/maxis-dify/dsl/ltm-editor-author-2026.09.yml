          \   _fail()\n\n\ndef _trusted_seed(pack, sources):\n    intent_seeds = {}\n\
          \    for source_id, source in sources.items():\n        if _intent(source):\n\
          \            seed = _object(source[\"content\"]).get(\"seed_html\", \"\"\
