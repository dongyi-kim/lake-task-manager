          \ path. Other payload contracts pass\nthrough unchanged for their normal\
          \ final validation. No evidence is created or\nchanged: quote support comes\
          \ from original source text, not model-authored facts.\n\"\"\"\n\nimport\
          \ hashlib\nimport html\nimport json\nimport re\nfrom urllib.parse import\
          \ urlsplit\n\n\n_ID = re.compile(r\"^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$\"\
          )\n_DIGEST = re.compile(r\"^[0-9a-f]{64}$\")\n_INTENT = \"ltm:user-intent:\"\
          \n_SECTIONS = (\"background\", \"scope\", \"work\", \"dod\")\n_HEADINGS\
          \ = dict(zip(_SECTIONS, (\"배경\", \"작업 범위\", \"작업\", \"완료 조건 (DoD)\")))\n\
