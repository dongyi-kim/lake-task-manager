          : {\"items\": {\"maxLength\": 500, \"minLength\": 1,\n            \"type\"\
          : \"string\"}, \"maxItems\": 16, \"type\": \"array\"},\n    },\n}\n\n\n\
          def _fail():\n    raise ValueError(\"invalid_editor_plan\")\n\n\ndef _canonical(value):\n\
