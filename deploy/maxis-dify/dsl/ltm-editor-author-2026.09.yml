          \        return None\n    mode_schema = props.get(\"mode\")\n    accepted\
          \ = [_EDITOR_SCHEMA[\"properties\"][\"mode\"],\n                {\"type\"\
          : \"string\", \"const\": \"description\"},\n                {\"type\": \"\
          string\", \"const\": \"comment\"}]\n    if mode_schema not in accepted:\n\
          \        _fail()\n    expected = _object(_canonical(_EDITOR_SCHEMA))\n \
          \   expected[\"properties\"][\"mode\"] = mode_schema\n    if _canonical(schema)\
          \ != _canonical(expected):\n        _fail()\n    return mode_schema\n\n\n\
          def _intent(source):\n    return source.get(\"kind\") == \"ltm\" and str(source.get(\"\
          canonical_id\", \"\")).startswith(_INTENT)\n\n\ndef _sources(pack):\n  \
          \  rows = pack.get(\"sources\")\n    if not isinstance(rows, list) or len(rows)\
          \ > 10:\n        _fail()\n    sources = {}\n    for row in rows:\n     \
          \   if not isinstance(row, dict):\n            _fail()\n        source_id\
          \ = row.get(\"source_id\")\n        if not isinstance(source_id, str) or\
          \ not _ID.fullmatch(source_id) or source_id in sources:\n            _fail()\n\
          \        if not isinstance(row.get(\"title\"), str) or not isinstance(row.get(\"\
          content\"), str):\n            _fail()\n        if hashlib.sha256(row[\"\
          content\"].encode(\"utf-8\")).hexdigest() != row.get(\"content_sha256\"\
          ):\n            _fail()\n        sources[source_id] = row\n    return sources\n\
          \n\ndef _mode(pack, sources, mode_schema):\n    modes = set()\n    if \"\
          const\" in mode_schema:\n        modes.add(mode_schema[\"const\"])\n   \
          \ for source in sources.values():\n        if _intent(source):\n       \
          \     request = _object(source[\"content\"])\n            if \"kind\" in\
          \ request:\n                modes.add(request[\"kind\"])\n    for row in\
          \ pack.get(\"role_context\", []):\n        if row.get(\"name\") == \"kind\"\
          :\n            modes.add(_decode(row[\"content_json\"]))\n        elif row.get(\"\
