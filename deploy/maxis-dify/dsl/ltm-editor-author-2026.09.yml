          , \"updateAuthor\"}\n_WIKI_PREFIX = re.compile(r\"^(?:h[1-6][.]|[*#]+)[\
          \ \\t]+(?=\\S)\")\n_JIRA_BODY = re.compile(r\"^/content(?:/[0-9]+)*(?:/fields)?/(?:description|(?:comments?|latestComment)(?:/[0-9]+)?(?:/(?:body|text))?)$\"\
          )\n_CONFLUENCE_BODY = re.compile(r\"^/content(?:(?:/[0-9]+)*/body)?$\")\n\
          _CODE_LEAF = re.compile(r\"\\{(?:code(?::[^}\\r\\n]*)?|noformat)\\}|<\\\
