          maxLength\", \"pattern\", \"format\",\n    \"minimum\", \"maximum\", \"\
          exclusiveMinimum\", \"exclusiveMaximum\", \"multipleOf\",\n}\n\n\nclass\
          \ GuardError(Exception):\n    \"\"\"An internal, non-sensitive validation\
          \ code.\"\"\"\n\n\ndef _fail(code):\n    raise GuardError(code)\n\n\ndef\
          \ _pairs(pairs):\n    result = {}\n    for key, value in pairs:\n      \
          \  if key in result:\n            _fail(\"duplicate_json_key\")\n      \
          \  result[key] = value\n    return result\n\n\ndef _nonfinite(_value):\n\
          \    _fail(\"nonfinite_json_number\")\n\n\ndef _json_value(value, object_only=False):\n\
          \    if isinstance(value, str):\n        try:\n            value = json.loads(\n\
          \                value, object_pairs_hook=_pairs, parse_constant=_nonfinite\n\
          \            )\n        except GuardError:\n            raise\n        except\
          \ Exception:\n            _fail(\"invalid_json\")\n    if object_only and\
          \ not isinstance(value, dict):\n        _fail(\"json_object_required\")\n\
          \    return value\n\n\ndef _json_equal(left, right):\n    return type(left)\
          \ is type(right) and left == right\n\n\ndef _canonical(value):\n    try:\n\
          \        return json.dumps(\n            value, ensure_ascii=False, sort_keys=True,\
          \ separators=(\",\", \":\"),\n            allow_nan=False,\n        )\n\
          \    except Exception:\n        _fail(\"non_json_value\")\n\n\ndef _strings(value,\
          \ depth=0):\n    if depth > 24:\n        _fail(\"value_too_deep\")\n   \
          \ if isinstance(value, str):\n        yield value\n    elif isinstance(value,\
          \ dict):\n        for item in value.values():\n            yield from _strings(item,\
          \ depth + 1)\n    elif isinstance(value, list):\n        for item in value:\n\
          \            yield from _strings(item, depth + 1)\n\n\ndef _proof_from(retrieval):\n\
          \    proofs = set()\n    for text in _strings(retrieval):\n        proofs.update(match.group(1).strip()\
          \ for match in _PROOF.finditer(text))\n    if len(proofs) != 1:\n      \
          \  _fail(\"knowledge_proof_unavailable\")\n    return next(iter(proofs))\n\
          \n\ndef _safe_text_list(value, limit):\n    if not isinstance(value, list)\
          \ or len(value) > limit:\n        _fail(\"invalid_text_list\")\n    if any(not\
          \ isinstance(row, str) or not row or len(row) > 500 for row in value):\n\
          \        _fail(\"invalid_text_list\")\n\n\ndef _safe_version(value, fallback):\n\
          \    return value if isinstance(value, str) and 0 < len(value) <= 120 else\
          \ fallback\n\n\ndef _verify_executed_workflow(workflow_version, executed_workflow_id):\n\
          \    \"\"\"Bind the caller's published UUID to Dify's execution-owned system\
          \ value.\"\"\"\n\n    if (\n        not isinstance(workflow_version, str)\n\
          \        or not _PUBLISHED_WORKFLOW_UUID.fullmatch(workflow_version)\n \
          \       or not isinstance(executed_workflow_id, str)\n        or not _PUBLISHED_WORKFLOW_UUID.fullmatch(executed_workflow_id)\n\
          \    ):\n        _fail(\"workflow_id_invalid\")\n    if workflow_version\
          \ != executed_workflow_id:\n        _fail(\"workflow_execution_mismatch\"\
          )\n\n\ndef _blocked(code, role_id, workflow_version, knowledge_version,\
          \ pack, proof):\n    digest = pack.get(\"knowledge_manifest_sha256\") if\
