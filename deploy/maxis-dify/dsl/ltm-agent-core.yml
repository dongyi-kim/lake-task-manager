        code_language: python3
        code: "\"\"\"Lossless Query-only LLM view of an already authorized KnowledgeGuard\
          \ output.\n\nStandalone stdlib Dify Code node. Wire only from KnowledgeGuard's\
          \ allow output;\nthe assembler and final guards must still receive the ORIGINAL\
          \ model_input.\nThis projection checks framing/bounds, not schema, source\
          \ or policy authority.\n\"\"\"\nimport json\nimport math\nimport re\n\n\n\
          _MAX_MODEL_INPUT_UTF8_BYTES = 9000  # KnowledgeGuard output bound\n_MAX_CONTEXT_PACK_UTF8_BYTES\
          \ = 6144  # ContextGuard / KnowledgeGuard pack bound\n_INPUT_FIELDS = {\"\
          contract\", \"context_pack\", \"role_id\", \"correlation_id\", \"output_contract\"\
          ,\n                 \"workflow_version\", \"knowledge_version\", \"knowledge_proof\"\
          , \"knowledge_context\"}\n_PACK_STRINGS = {\"contract\", \"request_id\"\
          , \"use_case\", \"query\", \"pseudonymous_user\", \"requested_at\",\n  \
          \               \"freshness\", \"knowledge_manifest_sha256\", \"payload_schema_json\"\
          , \"payload_schema_sha256\"}\n_PACK_ARRAYS = {\"sources\", \"facts\", \"\
          metrics\", \"role_context\", \"flags\"}\n_PACK_FIELDS = _PACK_STRINGS |\
          \ _PACK_ARRAYS | {\"scope\", \"partial\"}\n_HIDDEN_PACK_FIELDS = {\"contract\"\
          , \"payload_schema_json\", \"payload_schema_sha256\", \"knowledge_manifest_sha256\"\
          }\n_REQUEST_ID = re.compile(r\"[A-Za-z0-9][A-Za-z0-9._:-]{0,127}\")\n\n\n\
          def _fail():\n    raise ValueError(\"invalid_core_query_input\")\n\n\ndef\
          \ _canonical(value):\n    return json.dumps(value, ensure_ascii=False, sort_keys=True,\
          \ separators=(\",\", \":\"), allow_nan=False)\n\n\ndef _pairs(rows):\n \
          \   value = {}\n    for key, item in rows:\n        if key in value:\n \
          \           _fail()\n        value[key] = item\n    return value\n\n\ndef\
          \ _decode(raw):\n    if not isinstance(raw, str) or len(raw.encode(\"utf-8\"\
          )) > _MAX_MODEL_INPUT_UTF8_BYTES:\n        _fail()\n    value = json.loads(raw,\
          \ object_pairs_hook=_pairs, parse_constant=lambda _: _fail())\n    pending,\
          \ remaining = [(value, 0)], 4096\n    while pending:\n        item, depth\
          \ = pending.pop()\n        remaining -= 1\n        if depth > 32 or remaining\
          \ < 0 or (isinstance(item, float) and not math.isfinite(item)):\n      \
          \      _fail()\n        children = item.values() if isinstance(item, dict)\
          \ else item if isinstance(item, list) else []\n        pending.extend((child,\
          \ depth + 1) for child in children)\n    if not isinstance(value, dict)\
          \ or _canonical(value) != raw:\n        _fail()\n    return value\n\n\n\
          def main(model_input):\n    \"\"\"Return only a canonical semantic view;\
          \ no repairs, I/O or acceptance decision.\"\"\"\n    try:\n        incoming\
          \ = _decode(model_input)\n        if (set(incoming) != _INPUT_FIELDS\n \
          \               or any(not isinstance(incoming[key], str) for key in _INPUT_FIELDS\
