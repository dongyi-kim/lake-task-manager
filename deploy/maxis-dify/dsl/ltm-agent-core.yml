        code_language: python3
        code: "\"\"\"Bind transport metadata from the verified request, never from\
          \ model spelling.\n\nNo status, payload, claim, citation, warning or question\
          \ is changed. The existing\nContract Guard still checks every semantic value,\
          \ citation, schema and execution\nUUID after this step. This is not JSON\
          \ repair or a success fallback.\n\"\"\"\nimport json\nimport re\n\n_FIELDS\
          \ = {\n    \"contract\", \"role_id\", \"workflow_version\", \"knowledge_version\"\
          ,\n    \"knowledge_manifest_sha256\", \"knowledge_proof\",\n}\n_SEMANTIC\
          \ = {\n    \"status\", \"payload\", \"claims\", \"citations\", \"payload_claims\"\
          ,\n    \"missing_inputs\", \"warnings\",\n}\n\n\ndef _fail():\n    raise\
          \ ValueError(\"invalid_core_candidate_binding\")\n\n\ndef _pairs(rows):\n\
          \    result = {}\n    for key, value in rows:\n        if key in result:\n\
          \            _fail()\n        result[key] = value\n    return result\n\n\
