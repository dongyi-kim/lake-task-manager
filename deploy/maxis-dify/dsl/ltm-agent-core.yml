          ] != \"query_specialist\"\n                or incoming[\"output_contract\"\
          ] != \"remote-role-result.v1\"\n                or not _REQUEST_ID.fullmatch(incoming[\"\
          correlation_id\"])\n                or not isinstance(incoming[\"knowledge_context\"\
          ], list)):\n            _fail()\n        pack = incoming[\"context_pack\"\
          ]\n        if (not isinstance(pack, dict) or set(pack) != _PACK_FIELDS\n\
          \                or any(not isinstance(pack[key], str) for key in _PACK_STRINGS)\n\
          \                or any(not isinstance(pack[key], list) for key in _PACK_ARRAYS)\n\
          \                or not isinstance(pack[\"scope\"], dict) or type(pack[\"\
          partial\"]) is not bool\n                or pack[\"contract\"] != \"evidence-pack.v1\"\
