    - data:
        title: Knowledge Assembler
        type: code
        selected: false
        desc: Knowledge 단일 값·출처 보존; 원입력 결속과 producer 한도 검사
        code_language: python3
        code: "\"\"\"Pure draft JSON/schema primitives; callers own errors and canonical-input\
          \ policy.\n\nThe fail callback MUST never return and MUST raise ValueError\
          \ or a subclass.\nReturning would allow invalid values to continue; anyOf\
          \ catches only ValueError,\nso a different exception type would prevent\
          \ trying later valid branches.\nSchema keyword checks apply only to visited\
          \ nodes, matching the existing Query\nvalidator. Unused definitions/properties\
          \ and later anyOf branches are not scanned;\nthis helper does not validate\
          \ an entire raw schema independently of a value.\n\"\"\"\nimport json\n\
          import math\nimport re\n\n_SCHEMA_KEYS = {\"$defs\", \"$ref\", \"type\"\
          , \"enum\", \"properties\", \"required\", \"additionalProperties\", \"items\"\
          ,\n                \"maxItems\", \"minItems\", \"maxLength\", \"minLength\"\
          , \"pattern\", \"uniqueItems\", \"maxProperties\", \"anyOf\"}\n\n\ndef _canonical(value):\n\
          \    return json.dumps(value, ensure_ascii=False, sort_keys=True, separators=(\"\
          ,\", \":\"), allow_nan=False)\n\n\ndef _pairs(rows, fail):\n    result =\
          \ {}\n    for key, value in rows:\n        if key in result:\n         \
          \   fail()\n        result[key] = value\n    return result\n\n\ndef _decode(raw,\
          \ maximum, fail):\n    if not isinstance(raw, str) or len(raw.encode(\"\
          utf-8\")) > maximum:\n        fail()\n    value = json.loads(raw, object_pairs_hook=lambda\
          \ rows: _pairs(rows, fail), parse_constant=lambda _: fail())\n    remaining\
          \ = [4096]\n\n    def bounded(item, depth=0):\n        remaining[0] -= 1\n\
          \        if depth > 32 or remaining[0] < 0 or (isinstance(item, float) and\
          \ not math.isfinite(item)):\n            fail()\n        for child in item.values()\
          \ if isinstance(item, dict) else item if isinstance(item, list) else []:\n\
          \            bounded(child, depth + 1)\n\n    bounded(value)\n    if not\
          \ isinstance(value, dict):\n        fail()\n    return value\n\n\ndef _validate(value,\
          \ schema, root, fail, depth=0):\n    \"\"\"Validate the reviewed subset;\
          \ unknown keywords on visited nodes fail closed.\"\"\"\n    if depth > 32\
          \ or not isinstance(schema, dict) or set(schema) - _SCHEMA_KEYS:\n     \
          \   fail()\n    if \"$ref\" in schema:\n        ref = schema[\"$ref\"]\n\
          \        if set(schema) != {\"$ref\"} or not isinstance(ref, str) or not\
          \ ref.startswith(\"#/\"):\n            fail()\n        target = root\n \
          \       for part in ref[2:].split(\"/\"):\n            target = target[part.replace(\"\
          ~1\", \"/\").replace(\"~0\", \"~\")]\n        return _validate(value, target,\
          \ root, fail, depth + 1)\n    if \"anyOf\" in schema:\n        for branch\
          \ in schema[\"anyOf\"]:\n            try:\n                _validate(value,\
          \ branch, root, fail, depth + 1)\n                break\n            except\
          \ ValueError:\n                pass\n        else:\n            fail()\n\
          \    expected = schema.get(\"type\")\n    if expected is not None and type(value)\
          \ is not {\"object\": dict, \"array\": list, \"string\": str, \"boolean\"\
          : bool}.get(expected):\n        fail()\n    if \"enum\" in schema and not\
          \ any(type(value) is type(row) and value == row for row in schema[\"enum\"\
          ]):\n        fail()\n    if isinstance(value, dict):\n        properties\
          \ = schema.get(\"properties\", {})\n        if (any(key not in value for\
          \ key in schema.get(\"required\", []))\n                or schema.get(\"\
          additionalProperties\") is False and set(value) - set(properties)\n    \
          \            or len(value) > schema.get(\"maxProperties\", len(value))):\n\
          \            fail()\n        for key, item in value.items():\n         \
          \   if key in properties:\n                _validate(item, properties[key],\
          \ root, fail, depth + 1)\n    elif isinstance(value, list):\n        if\
          \ (not schema.get(\"minItems\", 0) <= len(value) <= schema.get(\"maxItems\"\
          , len(value))\n                or schema.get(\"uniqueItems\") and len({_canonical(row)\
          \ for row in value}) != len(value)):\n            fail()\n        if \"\
          items\" in schema:\n            for item in value:\n                _validate(item,\
          \ schema[\"items\"], root, fail, depth + 1)\n    elif isinstance(value,\
          \ str):\n        if (not schema.get(\"minLength\", 0) <= len(value) <= schema.get(\"\
          maxLength\", len(value))\n                or \"pattern\" in schema and re.fullmatch(schema[\"\
          pattern\"], value) is None):\n            fail()\n\n\"\"\"Original-input\
          \ binding only; no role payload traversal or meaning decisions.\n\nPrepend\
          \ core_draft_validation.py. The role supplies its exact schema constants\
          \ and\na nonreturning fail callback raising ValueError. Final guards remain\
          \ mandatory.\n\"\"\"\nimport hashlib\nimport re\n\n_MAX_CONTEXT_PACK_UTF8_BYTES\
          \ = 32768  # app.agent.maxis.context_guard / Knowledge Guard\n_MAX_MODEL_INPUT_UTF8_BYTES\
          \ = 40000  # Knowledge Guard output bound\n_INPUT_FIELDS = {\"contract\"\
          , \"context_pack\", \"role_id\", \"correlation_id\", \"output_contract\"\
          ,\n                 \"workflow_version\", \"knowledge_version\", \"knowledge_proof\"\
          , \"knowledge_context\"}\n_PACK_FIELDS = {\"contract\", \"request_id\",\
          \ \"use_case\", \"query\", \"pseudonymous_user\", \"requested_at\", \"scope\"\
          ,\n                \"sources\", \"facts\", \"metrics\", \"role_context\"\
          , \"freshness\", \"partial\", \"flags\",\n                \"knowledge_manifest_sha256\"\
          , \"payload_schema_json\", \"payload_schema_sha256\"}\n_ID = re.compile(r\"\
          [A-Za-z0-9][A-Za-z0-9._:-]{0,127}\")\n_DIGEST = re.compile(r\"[0-9a-f]{64}\"\
          )\n_UUID = re.compile(r\"[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}\"\
          )\n\n\ndef _digest(value):\n    return hashlib.sha256(value.encode(\"utf-8\"\
          )).hexdigest()\n\n\ndef _draft_context(raw, role_id, schema_json, schema_sha256,\
          \ draft_schema, fail):\n    incoming = _decode(raw, _MAX_MODEL_INPUT_UTF8_BYTES,\
          \ fail)\n    if (set(incoming) != _INPUT_FIELDS or _canonical(incoming)\
          \ != raw\n            or incoming[\"contract\"] != \"ltm-model-input.v1\"\
          \ or incoming[\"role_id\"] != role_id\n            or incoming[\"output_contract\"\
          ] != \"remote-role-result.v1\"):\n        fail()\n    pack = incoming[\"\
          context_pack\"]\n    if (not isinstance(pack, dict) or set(pack) != _PACK_FIELDS\n\
          \            or len(_canonical(pack).encode(\"utf-8\")) > _MAX_CONTEXT_PACK_UTF8_BYTES\n\
          \            or pack[\"contract\"] != \"evidence-pack.v1\" or pack[\"use_case\"\
          ] != role_id\n            or not isinstance(incoming[\"correlation_id\"\
