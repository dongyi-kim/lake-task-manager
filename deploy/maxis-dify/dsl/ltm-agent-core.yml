    - data:
        code: "\"\"\"Fail-closed guard template for a Dify 1.11.1 Python Code node.\n\
          \nThe shared renderer replaces the canonical lexical helper import with\
          \ its source,\nproducing a standard-library-only asset for each deployed\
          \ DSL. The Code node binds the\nLLM ``text`` output, all six Start variables,\
          \ Dify's ``sys.workflow_id``, and the\nKnowledge Guard's verified Release\
          \ Sentinel proof to :func:`main`; its single declared\noutput is the string\
          \ field ``result``.\n\"\"\"\n\nimport hashlib\nimport html\nimport json\n\
          import math\nimport re\n\n\"\"\"One canonical stdlib-only lexical view for\
          \ local and embedded Dify guards.\"\"\"\nimport json\nimport math\n\n\n\
          def source_lexical_parts(value):\n    \"\"\"Return original keys/scalars\
          \ separately; do not modify evidence or claims.\n\n    Decode exactly one\
          \ fully strict bounded JSON container. Unsupported input keeps\n    its\
          \ literal interpretation. Numeric spellings are retained; no Unicode/HTML\n\
          \    normalization occurs here. The guard tokenizes each part once, independently.\n\
          \    \"\"\"\n    class Number(str):\n        pass\n\n    def pairs(rows):\n\
          \        out = {}\n        for key, item in rows:\n            if key in\
          \ out:\n                raise ValueError(\"duplicate key\")\n          \
          \  out[key] = item\n        return out\n\n    def invalid(_):\n        raise\
          \ ValueError(\"nonfinite number\")\n\n    def number(raw):\n        if not\
          \ math.isfinite(float(raw)):\n            raise ValueError(\"nonfinite number\"\
          )\n        return Number(raw)\n\n    try:\n        if (not isinstance(value,\
          \ str) or len(value) > 12000\n                or len(value.encode(\"utf-8\"\
          )) > 36000\n                or not value.lstrip().startswith((\"{\", \"\
          [\"))):\n            return (value,)\n        parsed = json.loads(value,\
          \ object_pairs_hook=pairs, parse_constant=invalid,\n                   \
          \         parse_int=Number, parse_float=number)\n        if not isinstance(parsed,\
          \ (dict, list)):\n            return (value,)\n        parts, remaining\
          \ = [], [1024]\n\n        def collect(item, depth=0):\n            remaining[0]\
          \ -= 1\n            if depth > 8 or remaining[0] < 0:\n                raise\
          \ ValueError(\"shape limit\")\n            if isinstance(item, str):\n \
          \               item.encode(\"utf-8\")\n                parts.append(item)\n\
          \            elif isinstance(item, (dict, list)):\n                if len(item)\
          \ > 100:\n                    raise ValueError(\"collection limit\")\n \
          \               for key, child in item.items() if isinstance(item, dict)\
          \ else enumerate(item):\n                    if isinstance(item, dict):\n\
          \                        key.encode(\"utf-8\")\n                       \
          \ parts.append(key)\n                    collect(child, depth + 1)\n   \
          \         else:\n                parts.append(\"null\" if item is None else\
          \ \"true\" if item else \"false\")\n\n        collect(parsed)\n        return\
          \ tuple(parts)\n    except (ValueError, TypeError, OverflowError, RecursionError):\n\
          \        return (value,)  # No prefix extraction, duplicate winner or partial\
          \ decode.\n\n\n_CONTRACT = \"remote-role-result.v1\"\n_VALID_ROLES = {\n\
          \    \"request_architect\",\n    \"query_specialist\",\n    \"knowledge_curator\"\
          ,\n    \"portfolio_analyst\",\n    \"work_architect\",\n    \"auditor\"\
          ,\n    \"result_integrator\",\n    \"editor_author\",\n}\n_TOP_FIELDS =\
          \ {\n    \"contract\",\n    \"role_id\",\n    \"status\",\n    \"payload\"\
          ,\n    \"claims\",\n    \"payload_claims\",\n    \"citations\",\n    \"\
          missing_inputs\",\n    \"warnings\",\n    \"workflow_version\",\n    \"\
          knowledge_version\",\n    \"knowledge_manifest_sha256\",\n    \"knowledge_proof\"\
          ,\n}\n_IDENTIFIER = re.compile(r\"^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$\"\
          )\n_DIGEST = re.compile(r\"^[0-9a-f]{64}$\")\n_PUBLISHED_WORKFLOW_UUID =\
          \ re.compile(\n    r\"^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$\"\
          \n)\n_POINTER = re.compile(r\"^/(?:[^~/]|~[01])+(?:/(?:[^~/]|~[01])+)*$\"\
          )\n_PROOF = re.compile(\n    r\"(?m)^[ \\t]*(LTM_RELEASE_SENTINEL_V1=[^\\\
          r\\n]{1,216})[ \\t]*$\"\n)\n_GROUND_TOKEN = re.compile(r\"[0-9A-Za-z\\uac00-\\\
          ud7a3]{2,}\")\n_USER_INTENT_CANONICAL_PREFIX = \"ltm:user-intent:\"\n_CONTROL_FIELDS\
          \ = {\n    \"contract\", \"role_id\", \"mode\", \"tier\", \"issue_type\"\
          , \"type\", \"kind\",\n    \"finding_kind\", \"intent\", \"module\", \"\
