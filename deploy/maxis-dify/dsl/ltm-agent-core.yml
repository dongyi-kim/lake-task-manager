          executionreceipt\", \"mutationreceipt\", \"questionreceiptprojection\",\n\
          }\n_AUTHORITY_KEY_PARTS = {\n    \"authorization\", \"bearer\", \"cookie\"\
          , \"credential\", \"credentials\",\n    \"password\", \"passwd\", \"secret\"\
