          knowledge_version\"]) <= 120\n            or not isinstance(incoming[\"\
          knowledge_proof\"], str)\n            or not re.fullmatch(r\"LTM_RELEASE_SENTINEL_V1=[^\\\
          r\\n]{1,216}\", incoming[\"knowledge_proof\"])):\n        fail()\n    rows\
