        type: code
        selected: false
        desc: Query 의미 원문을 유지하며 ID·인용 연결·metadata만 조립
        code_language: python3
        code: "\"\"\"Assemble Query provenance without changing model meaning; both\
          \ final guards remain mandatory.\n\nStandalone Dify Code node, stdlib only.\
          \ The builder appends the three reviewed\nschema constants. Unbound or malformed\
          \ inputs fail without a partial candidate.\n\"\"\"\nimport hashlib\nimport\
          \ json\nimport math\nimport re\n\n_QUERY_SCHEMA_JSON = None\n_QUERY_SCHEMA_SHA256\
          \ = None\n_DRAFT_SCHEMA = None\n_MAX_CONTEXT_PACK_UTF8_BYTES = 6144  # app.agent.maxis.context_guard\
          \ / Knowledge Guard\n_MAX_MODEL_INPUT_UTF8_BYTES = 9000  # Knowledge Guard\
          \ output bound\n_MAX_DRAFT_UTF8_BYTES = 32768\n_INPUT_FIELDS = {\"contract\"\
          , \"context_pack\", \"role_id\", \"correlation_id\", \"output_contract\"\
          ,\n                 \"workflow_version\", \"knowledge_version\", \"knowledge_proof\"\
          , \"knowledge_context\"}\n_PACK_FIELDS = {\"contract\", \"request_id\",\
          \ \"use_case\", \"query\", \"pseudonymous_user\", \"requested_at\", \"scope\"\
          ,\n                \"sources\", \"facts\", \"metrics\", \"role_context\"\
          , \"freshness\", \"partial\", \"flags\",\n                \"knowledge_manifest_sha256\"\
          , \"payload_schema_json\", \"payload_schema_sha256\"}\n_SCHEMA_KEYS = {\"\
          $defs\", \"$ref\", \"type\", \"enum\", \"properties\", \"required\", \"\
          additionalProperties\", \"items\",\n                \"maxItems\", \"minItems\"\
          , \"maxLength\", \"minLength\", \"pattern\", \"uniqueItems\", \"maxProperties\"\
          , \"anyOf\"}\n_ID = re.compile(r\"[A-Za-z0-9][A-Za-z0-9._:-]{0,127}\")\n\
          _DIGEST = re.compile(r\"[0-9a-f]{64}\")\n_UUID = re.compile(r\"[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}\"\
          )\n\n\ndef _fail():\n    raise ValueError(\"invalid_core_query_draft\")\n\
          \n\ndef _canonical(value):\n    return json.dumps(value, ensure_ascii=False,\
          \ sort_keys=True, separators=(\",\", \":\"), allow_nan=False)\n\n\ndef _digest(value):\n\
          \    return hashlib.sha256(value.encode(\"utf-8\")).hexdigest()\n\n\ndef\
          \ _pairs(rows):\n    result = {}\n    for key, value in rows:\n        if\
          \ key in result:\n            _fail()\n        result[key] = value\n   \
          \ return result\n\n\ndef _decode(raw, maximum):\n    if not isinstance(raw,\
          \ str) or len(raw.encode(\"utf-8\")) > maximum:\n        _fail()\n    value\
          \ = json.loads(raw, object_pairs_hook=_pairs, parse_constant=lambda _: _fail())\n\
          \    remaining = [4096]\n\n    def bounded(item, depth=0):\n        remaining[0]\
          \ -= 1\n        if depth > 32 or remaining[0] < 0 or (isinstance(item, float)\
          \ and not math.isfinite(item)):\n            _fail()\n        for child\
          \ in item.values() if isinstance(item, dict) else item if isinstance(item,\
          \ list) else []:\n            bounded(child, depth + 1)\n\n    bounded(value)\n\
          \    if not isinstance(value, dict):\n        _fail()\n    return value\n\
          \n\ndef _validate(value, schema, root, depth=0):\n    \"\"\"Only the reviewed\
          \ Query subset; new schema keywords fail closed.\"\"\"\n    if depth > 32\
          \ or not isinstance(schema, dict) or set(schema) - _SCHEMA_KEYS:\n     \
          \   _fail()\n    if \"$ref\" in schema:\n        ref = schema[\"$ref\"]\n\
          \        if set(schema) != {\"$ref\"} or not isinstance(ref, str) or not\
          \ ref.startswith(\"#/\"):\n            _fail()\n        target = root\n\
          \        for part in ref[2:].split(\"/\"):\n            target = target[part.replace(\"\
          ~1\", \"/\").replace(\"~0\", \"~\")]\n        return _validate(value, target,\
          \ root, depth + 1)\n    if \"anyOf\" in schema:\n        for branch in schema[\"\
          anyOf\"]:\n            try:\n                _validate(value, branch, root,\
          \ depth + 1)\n                break\n            except ValueError:\n  \
          \              pass\n        else:\n            _fail()\n    expected =\
          \ schema.get(\"type\")\n    if expected is not None and type(value) is not\
          \ {\"object\": dict, \"array\": list, \"string\": str, \"boolean\": bool}.get(expected):\n\
          \        _fail()\n    if \"enum\" in schema and not any(type(value) is type(row)\
          \ and value == row for row in schema[\"enum\"]):\n        _fail()\n    if\
          \ isinstance(value, dict):\n        properties = schema.get(\"properties\"\
          , {})\n        if (any(key not in value for key in schema.get(\"required\"\
          , []))\n                or schema.get(\"additionalProperties\") is False\
          \ and set(value) - set(properties)\n                or len(value) > schema.get(\"\
          maxProperties\", len(value))):\n            _fail()\n        for key, item\
