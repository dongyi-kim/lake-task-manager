        code_language: python3
        code: "\"\"\"Stdlib-only Core unit classifier; never an authorization decision.\n\
          \nThe caller must supply Knowledge Guard's bounded model input after policy\
          \ allow.\nThis unit neither verifies policy/proof nor validates ordinary\
          \ business evidence.\nIt emits only a route, never a model response, citation,\
          \ or successful canary.\n\"\"\"\nimport hashlib\nimport json\nimport re\n\
          from datetime import datetime\n\n\n_INPUT_FIELDS = {\"contract\", \"context_pack\"\
          , \"role_id\", \"correlation_id\", \"output_contract\",\n              \
          \   \"workflow_version\", \"knowledge_version\", \"knowledge_proof\", \"\
          knowledge_context\"}\n_NONCE = re.compile(r\"probe_agent_core_([0-9a-f]{12})\"\
          )\n_UUID = re.compile(r\"[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\"\
          )\n_ID = re.compile(r\"[A-Za-z0-9][A-Za-z0-9._:-]{0,119}\")\n_DIGEST = re.compile(r\"\
          [0-9a-f]{64}\")\n_UTC_TIME = re.compile(r\"[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(?:\\\
          .[0-9]{1,6})?Z\")\n# The pure graph builder appends the canonical CompactQueryPlan\
          \ JSON and digest.\n# An unbound source cannot silently send query requests\
          \ to the generic model.\n_QUERY_SCHEMA_JSON = None\n_QUERY_SCHEMA_SHA256\
          \ = None\n\n\ndef _fail():\n    raise ValueError(\"invalid_core_control_input\"\
          )\n\n\ndef _canonical(value):\n    return json.dumps(value, ensure_ascii=False,\
          \ sort_keys=True, separators=(\",\", \":\"), allow_nan=False)\n\n\ndef _digest(value):\n\
          \    return hashlib.sha256(value.encode(\"utf-8\")).hexdigest()\n\n\ndef\
          \ _pairs(rows):\n    value = {}\n    for key, item in rows:\n        if\
          \ key in value:\n            _fail()\n        value[key] = item\n    return\
          \ value\n\n\ndef _text(value, maximum):\n    if not isinstance(value, str)\
          \ or not value.strip() or len(value.encode(\"utf-8\")) > maximum:\n    \
          \    _fail()\n    return value\n\n\ndef _reserved(pack):\n    \"\"\"Reserved\
          \ identity metadata only; never inspect query or Knowledge text.\"\"\"\n\
          \    for field in (\"sources\", \"role_context\"):\n        rows = pack.get(field)\n\
          \        if not isinstance(rows, list) or any(not isinstance(row, dict)\
          \ for row in rows):\n            _fail()\n    request = pack.get(\"request_id\"\
          )\n    if isinstance(request, str) and request.startswith(\"probe_\"):\n\
          \        return True\n    for source in pack.get(\"sources\", []):\n   \
          \     if isinstance(source, dict):\n            identity = source.get(\"\
          canonical_id\")\n            if isinstance(identity, str) and identity.startswith(\"\
          ltm:maxis-probe:\"):\n                return True\n    return any(isinstance(row,\
          \ dict) and row.get(\"name\") == \"activation_probe\"\n               for\
          \ row in pack.get(\"role_context\", []))\n\n\ndef _activation(incoming,\
          \ pack):\n    match = _NONCE.fullmatch(_text(pack.get(\"request_id\"), 128))\n\
          \    if (not match or incoming[\"role_id\"] != \"knowledge_curator\"\n \
          \           or incoming[\"correlation_id\"] != pack[\"request_id\"]\n  \
          \          or incoming[\"output_contract\"] != \"remote-role-result.v1\"\
          \n            or not _UUID.fullmatch(_text(incoming[\"workflow_version\"\
          ], 120))\n            or not _ID.fullmatch(_text(incoming[\"knowledge_version\"\
          ], 120))):\n        _fail()\n    _text(incoming[\"knowledge_proof\"], 240)\
          \  # Shape only; not Sentinel authentication.\n    nonce = match.group(1)\n\
          \    when = _text(pack.get(\"requested_at\"), 80)\n    if not _UTC_TIME.fullmatch(when):\n\
          \        _fail()\n    # Calendar validity only; avoid Python-version-specific\
          \ ISO 'Z' parsing.\n    datetime(int(when[:4]), int(when[5:7]), int(when[8:10]),\n\
          \             int(when[11:13]), int(when[14:16]), int(when[17:19]))\n  \
          \  manifest = _text(pack.get(\"knowledge_manifest_sha256\"), 64)\n    if\
          \ not _DIGEST.fullmatch(manifest):\n        _fail()\n    source_id = \"\
          probe_source_\" + nonce\n    content = \"The supplied synthetic activation\
          \ canary has state ready.\"\n    context = _canonical({\"expected_state\"\
          : \"ready\", \"probe_kind\": \"synthetic_contract\", \"workflow\": \"agent_core\"\
          })\n    schema = _canonical({\"type\": \"object\", \"additionalProperties\"\
          : False,\n                         \"properties\": {\"state\": {\"type\"\
          : \"string\", \"const\": \"ready\"}}, \"required\": [\"state\"]})\n    expected\
          \ = {\n        \"contract\": \"evidence-pack.v1\", \"request_id\": \"probe_agent_core_\"\
          \ + nonce,\n        \"use_case\": \"knowledge_curator\", \"query\": _text(pack.get(\"\
          query\"), 1024),\n        \"pseudonymous_user\": \"ltm_\" + nonce + \"0000\"\
          , \"requested_at\": when,\n        \"scope\": {\"projects\": [], \"spaces\"\
          : [], \"repositories\": []},\n        \"sources\": [{\"source_id\": source_id,\
          \ \"kind\": \"ltm\", \"canonical_id\": \"ltm:maxis-probe:agent_core\",\n\
          \            \"title\": \"Synthetic MAXIS activation canary\", \"scope\"\
          : \"\", \"url\": \"\", \"content\": content,\n            \"retrieved_at\"\
          : when, \"updated_at\": None, \"content_sha256\": _digest(content),\n  \
          \          \"partial\": False, \"truncated\": False}],\n        \"facts\"\
          : [{\"fact_id\": \"probe_fact_\" + nonce, \"text\": content,\n         \
          \          \"source_ids\": [source_id], \"observed_at\": when}],\n     \
          \   \"metrics\": [], \"role_context\": [{\"context_id\": \"probe_context_\"\
          \ + nonce,\n            \"name\": \"activation_probe\", \"content_json\"\
          : context, \"content_sha256\": _digest(context),\n            \"observed_at\"\
          : when, \"partial\": False}],\n        \"freshness\": \"fresh\", \"partial\"\
          : False, \"flags\": [],\n        \"knowledge_manifest_sha256\": manifest,\n\
          \        \"payload_schema_json\": schema, \"payload_schema_sha256\": _digest(schema),\n\
          \    }\n    # JSON comparison also rejects Python's bool/int aliases and\
          \ extra fields.\n    if _canonical(pack) != _canonical(expected):\n    \
          \    _fail()\n\n\ndef main(model_input):\n    \"\"\"Return semantic/control/query;\
          \ malformed reserved inputs raise a safe error.\n\n    No I/O, clock reads,\
          \ mutation, evidence rewriting, or fallback repair. A semantic\n    result\
          \ says only 'not this activation'; all existing validation remains required.\n\
          \    \"\"\"\n    try:\n        if not isinstance(model_input, str) or len(model_input.encode(\"\
          utf-8\")) > 9000:\n            _fail()\n        incoming = json.loads(model_input,\
          \ object_pairs_hook=_pairs, parse_constant=lambda _: _fail())\n        if\
          \ (not isinstance(incoming, dict) or set(incoming) != _INPUT_FIELDS\n  \
          \              or incoming[\"contract\"] != \"ltm-model-input.v1\" or _canonical(incoming)\
          \ != model_input):\n            _fail()\n        pack = incoming[\"context_pack\"\
          ]\n        if not isinstance(pack, dict) or len(_canonical(pack).encode(\"\
          utf-8\")) > 6144:\n            _fail()\n        if not _reserved(pack):\n\
          \            if incoming[\"role_id\"] == \"query_specialist\":\n       \
          \         if (pack.get(\"use_case\") != \"query_specialist\"\n         \
          \               or not isinstance(_QUERY_SCHEMA_JSON, str)\n           \
          \             or _digest(_QUERY_SCHEMA_JSON) != _QUERY_SCHEMA_SHA256\n \
          \                       or pack.get(\"payload_schema_json\") != _QUERY_SCHEMA_JSON\n\
          \                        or pack.get(\"payload_schema_sha256\") != _QUERY_SCHEMA_SHA256):\n\
          \                    _fail()\n                return {\"route\": \"query\"\
          }\n            return {\"route\": \"semantic\"}\n        _activation(incoming,\
          \ pack)\n        return {\"route\": \"control\"}\n    except Exception:\n\
          \        raise ValueError(\"invalid_core_control_input\") from None\n\n\
          # Generated from canonical CompactQueryPlan; not a second contract.\n_QUERY_SCHEMA_JSON\
          \ = '{\"$defs\":{\"QueryIntent\":{\"additionalProperties\":false,\"properties\"\
          :{\"exhaustive\":{\"type\":\"boolean\"},\"source\":{\"enum\":[\"jira\",\"\
          confluence\",\"comments\",\"people\",\"web\",\"github\"],\"type\":\"string\"\
          },\"subject\":{\"maxLength\":240,\"type\":\"string\"},\"where\":{\"maxLength\"\
          :240,\"type\":\"string\"}},\"required\":[\"source\"],\"type\":\"object\"\
          }},\"additionalProperties\":false,\"properties\":{\"reads\":{\"items\":{\"\
          $ref\":\"#/$defs/QueryIntent\"},\"maxItems\":8,\"type\":\"array\"},\"uncertainty\"\
          :{\"items\":{\"maxLength\":240,\"type\":\"string\"},\"maxItems\":8,\"type\"\
          :\"array\"}},\"type\":\"object\"}'\n_QUERY_SCHEMA_SHA256 = '5fbc738b950353f357cd00208bc45513db9e9b690fe5adaf07882a9d0f45bdce'"
        variables:
        - variable: model_input
