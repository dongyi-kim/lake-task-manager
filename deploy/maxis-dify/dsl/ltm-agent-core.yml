          ],\n        \"knowledge_proof\": proof,\n        \"knowledge_version\":\
          \ knowledge_version,\n        \"missing_inputs\": missing_inputs,\n    \
          \    \"payload\": {},\n        \"payload_claims\": [],\n        \"role_id\"\
          : role_id,\n        \"status\": status,\n        \"warnings\": warnings,\n\
          \        \"workflow_version\": workflow_version,\n    })\n\n\ndef main(retrieval_items,\
          \ sentinel_items, context_pack, query, role_id,\n         correlation_id,\
          \ output_contract, workflow_version,\n         executed_workflow_id, knowledge_version):\n\
          \    \"\"\"Return one verified allow/deny branch decision and bounded output.\"\
          \"\"\n\n    if not isinstance(role_id, str) or role_id not in _ALLOWED_DOCUMENT_NAMES_BY_ROLE:\n\
          \        _fail(\"role_not_allowed_for_\" + _WORKFLOW_KEY)\n    _bounded_scalar(role_id,\
          \ \"role_invalid\", _IDENTIFIER)\n    _bounded_scalar(correlation_id, \"\
          correlation_invalid\", _IDENTIFIER)\n    if _bounded_scalar(output_contract,\
          \ \"output_contract_invalid\") != _OUTPUT_CONTRACT:\n        _fail(\"output_contract_mismatch\"\
          )\n    _bounded_scalar(workflow_version, \"workflow_version_invalid\", _WORKFLOW_UUID)\n\
