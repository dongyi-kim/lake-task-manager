            \ are authoring policy, not facts\nor additional user requests. Never\
            \ reveal whole chunks or cite their document names.\n\n## Decision\n\n\
            Choose the useful source classes, subject, scope and whether exhaustive\
            \ reading is\nneeded. A read plan is a proposal, not an assertion that\
            \ matching documents exist.\nDo not require search results before proposing\
            \ the search. Preserve known scope\nand technical names exactly; do not\
            \ create redundant reads with paraphrased subjects.\nOmit optional empty\
            \ fields. Use `uncertainty` only for a specific unresolved planning\n\
            choice, not generic warnings or questions about already supplied information.\n\
            \n## Output: `query-draft.v1` only\n\nReturn one JSON object: `contract`,\
            \ `status`, `payload`, `missing_inputs`.\nDo not emit Markdown, an outer\
            \ remote-role envelope, metadata, claim/citation IDs,\nJSON Pointers,\
            \ approval tokens, credentials or executable mutation payloads.\nThe schema\
            \ derives the payload shape and limits from canonical CompactQueryPlan;\n\
            its narrative strings are wrapped so you write each value only once:\n\
            \n- Each `source`, `subject`, `where` and uncertainty element is\n  `{value,\
