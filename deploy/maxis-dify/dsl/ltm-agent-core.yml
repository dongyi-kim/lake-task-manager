          \n\ndef _canonical(value):\n    return json.dumps(value, ensure_ascii=False,\
          \ sort_keys=True, separators=(\",\", \":\"), allow_nan=False)\n\n\ndef _pairs(rows):\n\
          \    value = {}\n    for key, item in rows:\n        if key in value:\n\
