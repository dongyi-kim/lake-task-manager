              payload:
                type: object
              claims:
                type: array
                maxItems: 40
                items:
                  type: object
                  additionalProperties: false
                  required:
                  - claim_id
                  - kind
                  - text
                  - citation_ids
                  properties:
                    claim_id:
                      type: string
                      minLength: 1
                      maxLength: 128
                      pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]*$
                    kind:
                      enum:
