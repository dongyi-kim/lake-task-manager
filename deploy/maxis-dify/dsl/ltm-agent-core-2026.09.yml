            - workflow_version
            - knowledge_version
            - knowledge_manifest_sha256
            - knowledge_proof
            properties:
              contract:
                enum:
                - remote-role-result.v1
              role_id:
                enum:
                - request_architect
                - query_specialist
                - knowledge_curator
                - portfolio_analyst
                - work_architect
